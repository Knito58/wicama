name: Release to CurseForge

# Publish a GitHub release (its text becomes the changelog) or start this
# workflow manually (the changelog then comes from CHANGELOG.md). It builds the
# mod and uploads it to CurseForge.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CF_PROJECT_ID: "1784980"
  # CurseForge names, adjust here if CurseForge renames them:
  CF_GAME_VERSIONS: "26.3,Fabric,Java 25"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build and test
        run: ./gradlew build runGameTest

      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ github.event.release.body || '' }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          set -euo pipefail
          API=https://minecraft.curseforge.com/api
          JAR=$(ls build/libs/wicama-*.jar | grep -v -- '-sources' | head -1)
          echo "Uploading $JAR"

          curl -sSf -H "X-Api-Token: $CURSEFORGE_TOKEN" "$API/game/versions" -o versions.json
          IDS=$(IFS=,; for name in $CF_GAME_VERSIONS; do
            id=$(jq -r --arg n "$name" '[.[] | select(.name == $n)][0].id // empty' versions.json)
            [ -n "$id" ] || { echo "CurseForge has no game version named '$name'" >&2; exit 1; }
            echo "$id"
          done | paste -sd, -)
          echo "Game version ids: $IDS"

          if [ -z "$CHANGELOG" ]; then CHANGELOG=$(cat CHANGELOG.md); fi
          NAME="${RELEASE_NAME:-WiCaMa $(basename "$JAR" .jar | sed 's/^wicama-//')}"
          jq -n --arg log "${CHANGELOG:-Release build}" --arg name "$NAME" --argjson ids "[$IDS]" '{
            changelog: $log, changelogType: "markdown", displayName: $name,
            gameVersions: $ids, releaseType: "release",
            relations: {projects: [{slug: "fabric-api", type: "requiredDependency"}]}
          }' > metadata.json

          curl -sSf -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            -F "metadata=<metadata.json" -F "file=@$JAR" \
            "$API/projects/$CF_PROJECT_ID/upload-file"
