name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build and run game tests
        run: ./gradlew build runGameTest
      - uses: actions/upload-artifact@v4
        with:
          name: wicama-jar
          path: build/libs/*.jar
